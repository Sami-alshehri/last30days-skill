<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>0xNumb Cyber Brief</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#3fb950}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:20px}
header span{color:var(--accent)}
.wrap{display:flex;min-height:calc(100vh - 58px)}
nav{width:280px;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:12px}
nav h3{font-size:13px;color:var(--muted);margin:16px 0 6px}
nav a{display:block;padding:6px 8px;border-radius:6px;color:var(--text);text-decoration:none;font-size:14px}
nav a:hover,nav a.on{background:#1f6feb33}
main{flex:1;padding:24px;max-width:900px;overflow-x:auto;line-height:1.7}
main a{color:#58a6ff}main pre{background:var(--panel);padding:12px;border-radius:6px;overflow-x:auto}
.raw{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
@media(max-width:700px){.wrap{flex-direction:column}nav{width:100%;max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}}
</style></head><body>
<header>🛡️ 0xNumb <span>Cyber Brief</span></header>
<div class="wrap"><nav id="nav"></nav><main id="main">Loading…</main></div>
<script>
const nav=document.getElementById('nav'),main=document.getElementById('main');
const label=f=>f.replace(/\.md$/,'').replace(/^00-/,'🔥 ').replace(/-/g,' ');
async function show(day,f,a){
  document.querySelectorAll('nav a').forEach(x=>x.classList.remove('on'));a.classList.add('on');
  const t=await (await fetch(day+'/'+encodeURIComponent(f))).text();
  const raw=day+'/'+encodeURIComponent(f.replace(/\.md$/,'.raw.md'));
  main.innerHTML=DOMPurify.sanitize(marked.parse(t))+
    '<p class="raw"><a href="'+raw+'" target="_blank">📄 Raw evidence</a></p>';
  window.scrollTo(0,0);
}
fetch('list.json?'+Date.now()).then(r=>r.json()).then(days=>{
  if(!days.length){main.textContent='No reports yet.';return}
  days.forEach(([day,files],i)=>{
    const h=document.createElement('h3');h.textContent=day;nav.appendChild(h);
    files.forEach((f,j)=>{
      const a=document.createElement('a');a.href='#';a.textContent=label(f);
      a.onclick=e=>{e.preventDefault();show(day,f,a)};nav.appendChild(a);
      if(i===0&&j===0)show(day,f,a);
    });
  });
}).catch(()=>main.textContent='Could not load reports.');
</script></body></html>
